<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 线路管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>线路管理</h1>
            <div class="top-bar-right">
                <span class="admin-lang-switch"><i class="fas fa-language" style="color:#C41A1A"></i>
                    <select id="adminLangSelect" onchange="switchAdminLang(this.value)">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </span>
                <span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a>
            </div>
        </header>
        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h2>线路列表</h2>
                    <div>
                        <button class="btn btn-default" onclick="downloadTemplate()"><i class="fas fa-file-download"></i> 下载译文模板</button>
                        <button class="btn btn-primary" onclick="document.getElementById('transFile').click()"><i class="fas fa-file-import"></i> 上传译文</button>
                        <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> 新增线路</button>
                        <input type="file" id="transFile" accept=".csv,text/csv" style="display:none" onchange="handleTranslateUpload(this)">
                    </div>
                </div>
                <div class="translation-bar">
                    <span><strong>批量译文：</strong></span>
                    <span class="hint">语言</span>
                    <select id="transLang"><option value="en">English</option><option value="ja">日本語</option></select>
                    <span class="hint">上传 CSV（UTF-8，保留模板中的 ID 列，行顺序任意）；译文留空的字段将回退显示中文；重新上传会整体覆盖上一次结果。</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>ID</th><th>封面</th><th>名称</th><th>天数</th><th>主题</th><th>预算</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="formModal">
    <div class="modal" style="width:640px">
        <div class="modal-header"><h3 id="modalTitle">新增线路</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="fId">
            <div class="form-group"><label>名称</label><input class="form-control" id="fName" placeholder="线路名称"></div>
            <div class="form-group"><label>描述</label><textarea class="form-control" id="fDescription" placeholder="线路描述"></textarea></div>
            <div class="form-row">
                <div class="form-group"><label>天数</label><input class="form-control" id="fDays" type="number" placeholder="天数"></div>
                <div class="form-group"><label>预算(元)</label><input class="form-control" id="fBudget" type="number" placeholder="预算"></div>
            </div>
            <div class="form-group"><label>主题</label><input class="form-control" id="fTheme" placeholder="主题标签"></div>
            <div class="form-group"><label>交通建议</label><textarea class="form-control" id="fTrafficSuggestion" placeholder="交通建议"></textarea></div>
            <div class="form-group"><label>住宿建议</label><textarea class="form-control" id="fHotelSuggestion" placeholder="住宿建议"></textarea></div>
            <div class="form-group">
                <label>封面图片</label>
                <div class="img-upload-area">
                    <img id="coverPreview" src="" style="display:none" onerror="imgError(this)">
                    <input type="file" id="coverFile" accept="image/*" onchange="handleUpload()">
                    <input type="hidden" id="fCoverImage">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveItem()"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;

async function loadData(page) {
    currentPage = page;
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
    const data = await api(`/api/route/list?page=${page}&size=10`);
    if (!data) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state">加载失败</td></tr>'; return; }

    const list = data.records || data.list || data || [];
    const total = data.pages || data.totalPages || Math.ceil((data.total || list.length) / 10);
    if (!list.length) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i> 暂无数据</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }

    let h = '';
    list.forEach(r => {
        const cover = r.coverImage ? `<img src="${imgSrc(r.coverImage)}" class="img-preview" onerror="imgError(this)">` : '-';
        h += `<tr>
            <td>${r.id}</td>
            <td>${cover}</td>
            <td>${escHtml(r.name)}${fallbackNote(r)}</td>
            <td>${r.days || '-'}天</td>
            <td>${escHtml(r.theme || '-')}</td>
            <td>${r.budget != null ? '¥' + r.budget : '-'}</td>
            <td class="action-btns">
                <button class="btn btn-sm btn-info" onclick="editItem(${r.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${r.id})"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    });
    document.getElementById('tableBody').innerHTML = h;
    renderPagination('pagination', currentPage, total, 'loadData');
}

function openModal(item) {
    document.getElementById('modalTitle').textContent = item ? '编辑线路' : '新增线路';
    document.getElementById('fId').value = item ? item.id : '';
    document.getElementById('fName').value = item ? item.name || '' : '';
    document.getElementById('fDescription').value = item ? item.description || '' : '';
    document.getElementById('fDays').value = item ? item.days || '' : '';
    document.getElementById('fBudget').value = item ? item.budget || '' : '';
    document.getElementById('fTheme').value = item ? item.theme || '' : '';
    document.getElementById('fTrafficSuggestion').value = item ? item.trafficSuggestion || '' : '';
    document.getElementById('fHotelSuggestion').value = item ? item.hotelSuggestion || '' : '';
    document.getElementById('fCoverImage').value = item ? item.coverImage || '' : '';
    const preview = document.getElementById('coverPreview');
    if (item && item.coverImage) { preview.src = imgSrc(item.coverImage); preview.style.display = ''; } else { preview.style.display = 'none'; }
    document.getElementById('coverFile').value = '';
    document.getElementById('formModal').classList.add('active');
}

function closeModal() { document.getElementById('formModal').classList.remove('active'); }

async function editItem(id) {
    const data = await api('/api/route/detail?id=' + id + '&lang=zh');
    if (data) openModal(data);
}

async function handleUpload() {
    const url = await uploadFile(document.getElementById('coverFile'));
    if (url) {
        document.getElementById('fCoverImage').value = url;
        document.getElementById('coverPreview').src = imgSrc(url);
        document.getElementById('coverPreview').style.display = '';
    }
}

async function saveItem() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { showToast('请输入线路名称', 'warning'); return; }
    const fields = { name, description: document.getElementById('fDescription').value.trim(),
        days: document.getElementById('fDays').value, budget: document.getElementById('fBudget').value,
        theme: document.getElementById('fTheme').value.trim(), trafficSuggestion: document.getElementById('fTrafficSuggestion').value.trim(),
        hotelSuggestion: document.getElementById('fHotelSuggestion').value.trim(), coverImage: document.getElementById('fCoverImage').value };
    const id = document.getElementById('fId').value;
    if (id) fields.id = id;
    const params = Object.entries(fields).filter(([,v]) => v !== '').map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const data = await api('/api/admin/route/save?' + params);
    if (data !== null) { showToast('保存成功'); closeModal(); loadData(currentPage); }
}

function deleteItem(id) {
    showConfirm('确定要删除该线路吗？', async () => {
        const data = await api('/api/admin/route/delete?id=' + id);
        if (data !== null) { showToast('删除成功'); loadData(currentPage); }
    });
}

/* ========== 批量译文 ========== */
function downloadTemplate() {
    const lang = document.getElementById('transLang').value;
    window.open(API + '/api/admin/translation/template?type=route&lang=' + lang, '_blank');
}

async function handleTranslateUpload(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    const lang = document.getElementById('transLang').value;
    const res = await uploadTranslation(file, 'route', lang);
    if (res.code !== 200) { showToast(res.msg || '译文导入失败', 'error'); return; }
    const d = res.data || {};
    showToast((res.msg || '导入成功') + '，' + (d.blankCells || 0) + ' 个字段留空将回退中文');
    loadData(currentPage);
}

document.getElementById('adminLangSelect').value = currentLang;
document.addEventListener('adminlangchange', () => loadData(currentPage));

loadData(1);
</script>
</body>
</html>
